# Omarchy Apple Silicon Touch Bar (tiny-dfr).
# Media/Omarchy actions without Fn. Hold Fn for F1–F12.
# Override by copying shell/plugins/touchbar/layout.json to
# ~/.config/omarchy/touchbar.json and saving; the omarchy.touchbar plugin
# rewrites /etc/tiny-dfr/config.toml.
MediaLayerDefault = true
ShowButtonOutlines = true
EnablePixelShift = false
FontTemplate = ":bold"
AdaptiveBrightness = true
ActiveBrightness = 128

PrimaryLayerKeys = [
    { Text = "F1",  Action = "F1"  },
    { Text = "F2",  Action = "F2"  },
    { Text = "F3",  Action = "F3"  },
    { Text = "F4",  Action = "F4"  },
    { Text = "F5",  Action = "F5"  },
    { Text = "F6",  Action = "F6"  },
    { Text = "F7",  Action = "F7"  },
    { Text = "F8",  Action = "F8"  },
    { Text = "F9",  Action = "F9"  },
    { Text = "F10", Action = "F10" },
    { Text = "F11", Action = "F11" },
    { Text = "F12", Action = "F12" }
]

MediaLayerKeys = [
    { Icon = "brightness_low",  Action = "BrightnessDown" },
    { Icon = "brightness_high", Action = "BrightnessUp"   },
    { Icon = "search",          Action = "Search"         },
    { Text = "term",            Action = "F13"            },
    { Text = "lock",            Action = "F14"            },
    { Text = "snip",            Action = "Print"          },
    { Icon = "mic_off",         Action = "MicMute"        },
    { Icon = "play_pause",      Action = "PlayPause"      },
    { Icon = "fast_rewind",     Action = "PreviousSong"   },
    { Icon = "fast_forward",    Action = "NextSong"       },
    { Icon = "volume_off",      Action = "Mute"           },
    { Icon = "volume_down",     Action = "VolumeDown"     },
    { Icon = "volume_up",       Action = "VolumeUp"       }
]
