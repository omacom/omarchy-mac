context.properties = {
  log.level = 0
}

context.spa-libs = {
  audio.convert.* = audioconvert/libspa-audioconvert
  support.* = support/libspa-support
}

context.modules = [
  { name = libpipewire-module-rt
    args = { }
    flags = [ ifexists nofail ]
  }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-adapter }

  # J456: select the third AOP channel, remove rumble and apply 40 dB gain.
  # The watch command replaces @TARGET@ with the discovered object serial.
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "iMac Built-in Microphone"
      media.name = "iMac Built-in Microphone"
      filter.graph = {
        nodes = [
          { type = builtin name = highpass label = bq_highpass
            control = { Freq = 100 Q = 0.707 } }
          { type = builtin name = gain1 label = mixer
            control = { "Gain 1" = 10 } }
          { type = builtin name = gain2 label = mixer
            control = { "Gain 1" = 10 } }
        ]
        links = [
          { output = "highpass:Out" input = "gain1:In 1" }
          { output = "gain1:Out" input = "gain2:In 1" }
        ]
        inputs = [ null null "highpass:In" ]
        outputs = [ "gain2:Out" ]
      }
      capture.props = {
        node.name = "capture.omarchy-j456-microphone"
        target.object = @TARGET@
        audio.channels = 3
        audio.position = [ AUX0 AUX1 AUX2 ]
        audio.rate = 48000
        stream.dont-remix = true
        node.dont-fallback = true
        node.passive = true
      }
      playback.props = {
        node.name = "omarchy_j456_microphone"
        node.description = "iMac Built-in Microphone"
        media.class = "Audio/Source"
        audio.channels = 1
        audio.position = [ MONO ]
        audio.rate = 48000
        priority.session = 1
      }
    }
  }
]
