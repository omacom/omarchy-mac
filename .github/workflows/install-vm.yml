name: Install VM

# Run untrusted PR code only on disposable GitHub-hosted ARM64 machines.
# nspawn needs an ARM64 host kernel, not nested KVM or Apple hardware.
on:
  pull_request:
  push:
    branches: [quattro]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  install:
    name: install.sh on Arch Linux ARM
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      OMARCHY_INSTALL_VM_WORK: /var/tmp/omarchy-install-${{ github.run_id }}-${{ github.run_attempt }}
      OMARCHY_INSTALL_VM_PACKAGE_SOURCES: '1'
      OMARCHY_INSTALL_VM_IDEMPOTENCY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default pull_request checkout tests GitHub's merge ref.
          persist-credentials: false

      - name: Prepare hosted machine
        run: |
          # These hosted-image toolchains are unused by the Arch guest.
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/vcpkg /home/linuxbrew/.linuxbrew
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends systemd-container curl gnupg ca-certificates tar gzip
          sudo apt-get clean
          uname -a
          id
          systemd-nspawn --version
          stat -fc %T /sys/fs/cgroup
          # Helpful when distinguishing host kernel support from nspawn filtering.
          if [[ -r /boot/config-$(uname -r) ]]; then
            grep -E '^(CONFIG_SECURITY_LANDLOCK|CONFIG_LSM)=' "/boot/config-$(uname -r)" || true
          fi
          sudo cat /sys/kernel/security/lsm || true
          getconf PAGESIZE
          df -h /var/tmp "$RUNNER_TEMP"
          free -m
          available_kb=$(df -Pk /var/tmp | awk 'NR == 2 { print $4 }')
          if (( available_kb < 20 * 1024 * 1024 )); then
            echo "At least 20 GiB free is required for the ARM installation test" >&2
            exit 1
          fi

      - name: Validate package sources, fresh install, and repeat install
        env:
          OMARCHY_INSTALL_VM_CACHE: ${{ runner.temp }}/omarchy-install-cache-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$OMARCHY_INSTALL_VM_WORK/logs"
          set +e
          sudo --preserve-env=HOME,OMARCHY_INSTALL_VM_WORK,OMARCHY_INSTALL_VM_CACHE,OMARCHY_INSTALL_VM_PACKAGE_SOURCES,OMARCHY_INSTALL_VM_IDEMPOTENCY \
            bash ./test/vm/run-selective-edge 2>&1 | tee "$RUNNER_TEMP/omarchy-harness.log"
          status=${PIPESTATUS[0]}
          set -e
          mkdir -p "$OMARCHY_INSTALL_VM_WORK/logs"
          cp "$RUNNER_TEMP/omarchy-harness.log" "$OMARCHY_INSTALL_VM_WORK/logs/harness.log"
          printf '%s\n' "$status" >"$OMARCHY_INSTALL_VM_WORK/logs/exit_code"
          printf 'ARM install harness exited %s. See the install-vm-logs artifact for package, install, and repeat-install results.\n' "$status" >>"$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: install-vm-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.OMARCHY_INSTALL_VM_WORK }}/logs/
          retention-days: 7
          if-no-files-found: warn
