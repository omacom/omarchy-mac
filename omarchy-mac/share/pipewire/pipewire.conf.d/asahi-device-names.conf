# Name the built-in audio devices as macOS does, without asahi-audio's board
# codes ("MacBook Pro J314 Speakers"). asahi-audio's DSP nodes come from filter
# graphs WirePlumber loads whole, so no WirePlumber rule reaches them; the
# PipeWire daemon applies node.rules to every node, whoever created it.
# asahi-audio names every MacBook graph by its board (jNNN) and the desktops
# "mini" and "studio"; its DSP microphone is mono, which the stereo microphone
# the omarchy-mac mapper makes from it replaces for apps.
node.rules = [
  {
    matches = [
      { node.name = "~^audio_effect\\.j[0-9]+-convolver$" }
    ]
    actions = {
      update-props = {
        node.description = "MacBook Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "audio_effect.mini-convolver" }
      { node.name = "audio_effect.studio-convolver" }
    ]
    actions = {
      update-props = {
        node.description = "Built-in Speakers"
      }
    }
  }
  {
    matches = [
      { node.name = "~^effect_output\\.j[0-9]+-mic$" }
    ]
    actions = {
      update-props = {
        node.description = "MacBook Microphone (Mono)"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones__sink" }
    ]
    actions = {
      update-props = {
        node.description = "Headphones"
      }
    }
  }
  {
    matches = [
      { node.name = "alsa_input.platform-sound.HiFi__Headset__source" }
    ]
    actions = {
      update-props = {
        node.description = "Headset Microphone"
      }
    }
  }
]
