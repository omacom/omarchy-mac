# The sd-encrypt generator's key-device mount (rd.luks.key=...:UUID=<Boot>)
# mounts the Boot partition read-only as soon as its device node appears. The
# encrypt unit holds that partition read-write until it is done, and ext4
# refuses a second mount with other superblock flags: the key mount fails,
# systemd-cryptsetup@root.service fails with it, and emergency.target stops the
# unit in the middle of cryptsetup open. The key mount waits for the unit.
[Unit]
After=omarchy-mac-encrypt.service
