# The moon key on the MacBook's top row is Do Not Disturb, but the kernel
# reports it as KEY_SLEEP, and logind suspends on that by default. Hyprland
# binds it to Do Not Disturb instead (/usr/share/omarchy-platform/hypr/defaults/apple.lua).
[Login]
HandleSuspendKey=ignore
HandleSuspendKeyLongPress=ignore
