# Keep the Apple Silicon speaker and headphone outputs open between streams.
# PipeWire suspends an idle sink after five seconds, which powers down the
# speaker amplifiers; reopening powers them back up with an audible pop on
# every start and stop of playback.
# Matched by ALSA path because 99-asahi.conf renames the speaker node and hides
# it behind the per-model filter chain. Device 1 is the speaker array and
# device 0 the headphone jack on every AppleJ model.
monitor.alsa.rules = [
  {
    matches = [
      { api.alsa.path = "~hw:AppleJ[0-9][0-9][0-9],[01]" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
