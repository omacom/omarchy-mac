# omarchy-mac: Apple Silicon's Hyprland hardware defaults. The runtime reads
# this file as data (docs/lifecycle-dispatch.md, "Platform Hyprland defaults"),
# applies it after Omarchy's defaults and before the theme and the user's
# files, which replace anything here, and only on apple-silicon.
version 1
platform apple-silicon

# The built-in trackpad clicks physically, and Asahi's disable-while-typing
# does not stop stray taps while typing, so tapping stays off. The user's
# input.lua turns it on with hl.config({ input = { touchpad = { tap_to_click = true } } }).
set input.touchpad.tap_to_click false

# Apple's display controller runs its own firmware, and a hardware cursor plane
# makes every pointer update a round trip into it, so the pointer lags the
# hand. Draw it in software. The user's looknfeel.lua can set it back to 0.
set cursor.no_hardware_cursors true

# No Print Screen key: SUPER+F10-F12 capture, and so do the same chords on the
# top row's media keys, which send media keysyms unless Fn is held.
bind | SUPER + F12 | Screenshot display | omarchy-capture-screenshot fullscreen
bind | SUPER + F11 | Screenshot region | omarchy-capture-screenshot region
bind | SUPER + F10 | Screenshot window | omarchy-capture-screenshot windows
bind | SUPER + XF86AudioRaiseVolume | Screenshot display (Apple top row) | omarchy-capture-screenshot fullscreen
bind | SUPER + XF86AudioLowerVolume | Screenshot region (Apple top row) | omarchy-capture-screenshot region
bind | SUPER + XF86AudioMute | Screenshot window (Apple top row) | omarchy-capture-screenshot windows

# No keyboard-backlight keys: Ctrl+brightness drives the keyboard backlight.
# Shift+brightness stays Omarchy's display maximum and minimum.
bind locked,repeating | CTRL + XF86MonBrightnessUp | Keyboard brightness up | omarchy-brightness-keyboard up
bind locked,repeating | CTRL + XF86MonBrightnessDown | Keyboard brightness down | omarchy-brightness-keyboard down
