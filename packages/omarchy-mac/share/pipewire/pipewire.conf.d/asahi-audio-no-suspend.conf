# Keep the Apple Silicon speaker DSP graph running between streams.
# The WirePlumber policy keeps the speaker PCM open, but the asahi-audio filter
# chain still pauses when idle. The #351 report traced the clicks that remain
# to the chain restarting (convolver and loudness state reset), which browsers
# trigger on every seek by recreating their stream (see also
# AsahiLinux/asahi-audio#84). The cost is a running DSP graph while idle: on a
# J416 the audio stack went from about 0.1% to 1.8-2.0% of one core.
# These nodes come from module-filter-chain, not the ALSA monitor, so only
# PipeWire's server-side node.rules can reach them. Every model's speaker chain
# is named <model>-convolver; the -mic capture chains keep suspending.
node.rules = [
  {
    matches = [
      { node.name = "~^audio_effect[.].*-convolver$" }
      { node.name = "~^effect_output[.].*-convolver$" }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
        node.always-process = true
      }
    }
  }
]
