# The asahi and firmware hooks go right before filesystems. Every
# omarchy-mac-boot drop-in adds to the platform's HOOKS baseline
# (00-omarchy-hooks.conf) and only on Apple Silicon: anywhere else the package
# leaves the initramfs exactly as the baseline and the other drop-ins set it.
# This package only installs on Macs, so a runtime too old to ship the detector
# still gets the Apple hooks, and a detector that cannot place the machine
# stops the build, as the baseline does.
_omarchy_mac_platform=apple-silicon
if command -v omarchy-hw-platform >/dev/null; then
  _omarchy_mac_platform=$(omarchy-hw-platform) || return 1
fi
if [[ $_omarchy_mac_platform == apple-silicon ]]; then
  _omarchy_asahi_hooks=()
  _omarchy_asahi_added=false
  for _omarchy_asahi_hook in "${HOOKS[@]}"; do
    if [[ $_omarchy_asahi_hook == asahi ]]; then
      _omarchy_asahi_added=true
    fi
    if [[ $_omarchy_asahi_hook == filesystems && $_omarchy_asahi_added == false ]]; then
      _omarchy_asahi_hooks+=(asahi omarchy-vendorfw)
      _omarchy_asahi_added=true
    fi
    _omarchy_asahi_hooks+=("$_omarchy_asahi_hook")
  done
  if [[ $_omarchy_asahi_added == false ]]; then
    _omarchy_asahi_hooks+=(asahi omarchy-vendorfw)
  fi
  HOOKS=("${_omarchy_asahi_hooks[@]}")
  unset _omarchy_asahi_hooks _omarchy_asahi_hook _omarchy_asahi_added
fi
unset _omarchy_mac_platform
